<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GeoTour</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#175e48">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
</head>
<body>

<header id="app-header">
  <button id="btn-home" class="header-btn" title="Accueil" aria-label="Accueil">🏠</button>
  <h1 id="app-title">GeoTour</h1>
  <nav id="onglets-principaux">
    <button class="onglet" data-mode="creer">📷 Créer</button>
    <button class="onglet" data-mode="randonnee">🥾 Randonnée</button>
  </nav>
</header>

<!-- Écran d'accueil -->
<section id="screen-accueil" class="screen active">
  <div class="accueil-cartes">
    <button class="carte-mode" data-mode="creer">
      <span class="carte-icone">📷</span>
      <span class="carte-titre">Créer un waypoint</span>
      <span class="carte-desc">À partir d'une photo géolocalisée, avec repli manuel si besoin</span>
    </button>
    <button class="carte-mode" data-mode="randonnee">
      <span class="carte-icone">🥾</span>
      <span class="carte-titre">Randonnée</span>
      <span class="carte-desc">Importer un KMZ/KML/GPX, visualiser, gérer les waypoints</span>
    </button>
  </div>
</section>

<!-- Écran Créer (ex-photo2waypoint) -->
<section id="screen-creer" class="screen">
  <div class="form-creer">
    <label class="champ">
      Photo (JPEG)
      <input type="file" id="input-photo" accept="image/jpeg">
    </label>

    <div id="apercu-photo-conteneur"></div>
    <p id="statut-gps" class="statut"></p>

    <div id="repli-manuel" class="repli-manuel" hidden>
      <p>Aucune coordonnée GPS trouvée dans la photo. Choisissez une méthode :</p>
      <div class="choix-repli">
        <button type="button" id="btn-repli-saisie" class="action-secondaire">Saisir les coordonnées</button>
        <button type="button" id="btn-repli-carte" class="action-secondaire">Pointer sur la carte</button>
      </div>
      <div id="repli-saisie" hidden class="repli-saisie">
        <label class="champ">Latitude <input type="number" step="any" id="input-lat"></label>
        <label class="champ">Longitude <input type="number" step="any" id="input-lon"></label>
      </div>
      <div id="repli-carte" hidden>
        <div id="carte-pointage"></div>
        <p class="aide">Touchez la carte pour placer le point.</p>
      </div>
    </div>

    <label class="champ">Nom (40 car. max)
      <input type="text" id="input-nom" maxlength="40">
    </label>
    <label class="champ">Commentaire (600 car. max)
      <textarea id="input-commentaire" maxlength="600" rows="4"></textarea>
    </label>

    <button id="btn-ajouter-a-randonnee" class="action-principale" disabled>
      ➕ Ajouter à la randonnée en cours
    </button>
    <button id="btn-export-kmz-creer" class="action-secondaire" disabled>
      💾 Exporter en KMZ
    </button>
  </div>
</section>

<!-- Écran Randonnée (ex-randonneur8) -->
<section id="screen-randonnee" class="screen">
  <div class="zone-import" id="zone-import" tabindex="0" role="button">
    <input type="file" id="input-import-trace" accept=".kml,.kmz,.gpx" hidden>
    <span class="zone-import-icone">🗺️</span>
    <p class="zone-import-texte">Glissez un fichier <strong>KMZ, KML</strong> ou <strong>GPX</strong> ou cliquez pour parcourir</p>
    <p id="zone-import-nom" class="zone-import-nom">Aucun fichier chargé</p>
  </div>
  <div class="barre-import-actions">
    <button id="btn-import-remplacer" class="action-secondaire" disabled>🔄 Remplacer</button>
    <button id="btn-import-ajouter" class="action-secondaire" disabled>➕ Ajouter</button>
  </div>

  <div class="segmented-fond" id="segmented-fond">
    <button type="button" class="segment actif" data-fond="osm">OSM</button>
    <button type="button" class="segment" data-fond="ign-plan">IGN Plan</button>
    <button type="button" class="segment" data-fond="ign-ortho">IGN Ortho</button>
    <button type="button" class="segment" data-fond="mbtiles" disabled title="MBtiles hors-ligne : pas encore disponible dans geotour">📦 MBtiles</button>
  </div>

  <div id="carte-randonnee"></div>

  <div class="stats-grid">
    <div class="stat"><span class="stat-icone">📍</span><span id="stat-waypoints" class="stat-valeur">0</span><span class="stat-label">Waypoints</span></div>
    <div class="stat"><span class="stat-icone">📷</span><span id="stat-photos" class="stat-valeur">0</span><span class="stat-label">Photos</span></div>
    <div class="stat"><span class="stat-icone">📏</span><span id="stat-distance" class="stat-valeur">—</span><span class="stat-label">Distance</span></div>
    <div class="stat"><span class="stat-icone">⬈</span><span id="stat-dplus" class="stat-valeur">—</span><span class="stat-label">D+</span></div>
    <div class="stat"><span class="stat-icone">⬊</span><span id="stat-dmoins" class="stat-valeur">—</span><span class="stat-label">D-</span></div>
  </div>
  <p id="profil-erreur" class="statut"></p>
  <div id="profil-conteneur"></div>

  <div id="liste-waypoints" class="liste-waypoints"></div>

  <div class="barre-randonnee-actions">
    <button id="btn-mode-visite" class="action-secondaire" disabled>🎙️ Mode Visite</button>
    <button id="btn-export-diaporama" class="action-secondaire" disabled>🖥️ Diaporama HTML</button>
    <button id="btn-export-session-kmz" class="action-secondaire" disabled>💾 Sauvegarder la session en KMZ</button>
    <button id="btn-export-deploiement" class="action-secondaire" disabled>📦 Déploiement (zip)</button>
  </div>

  <div id="panneau-visite" class="panneau-visite" hidden>
    <div class="visite-entete">
      <button id="btn-visite-fermer" class="header-btn" aria-label="Fermer la visite">✕</button>
      <span id="visite-compteur"></span>
    </div>
    <div id="carte-visite"></div>
    <div class="visite-fiche">
      <div id="visite-photo-conteneur"></div>
      <h2 id="visite-nom"></h2>
      <p id="visite-commentaire"></p>
    </div>
    <div class="visite-controles">
      <button id="btn-visite-precedent" class="action-secondaire">◀ Précédent</button>
      <button id="btn-visite-lire" class="action-principale">🔊 Lire</button>
      <button id="btn-visite-suivant" class="action-secondaire">Suivant ▶</button>
    </div>
  </div>
</section>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/jszip.min.js"></script>
<script src="js/state.js"></script>
<script src="js/map-layers.js"></script>
<script src="js/kml.js"></script>
<script src="js/export.js"></script>
<script src="js/altimetrie.js"></script>
<script src="js/exif.js"></script>
<script src="js/mode-creer.js"></script>
<script src="js/mode-randonnee.js"></script>
<script src="js/visite.js"></script>
<script src="js/app.js"></script>
</body>
</html>
